<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camera sanity check</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #090b10; }
      main { width: min(920px, calc(100% - 32px)); }
      video { width: 100%; max-height: 72vh; object-fit: contain; border-radius: 18px; background: #111; }
      button { margin: 16px 0; padding: 12px 18px; border: 0; border-radius: 10px; font-weight: 700; cursor: pointer; }
      #status { color: #b8bdc8; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <h1>카메라 단독 테스트</h1>
      <p id="status">아래 버튼을 누르세요.</p>
      <button id="start">카메라 시작</button>
      <video id="video" autoplay playsinline muted></video>
    </main>
    <script type="module">
      const status = document.querySelector('#status');
      const button = document.querySelector('#start');
      const video = document.querySelector('#video');

      button.addEventListener('click', async () => {
        button.disabled = true;
        status.textContent = '카메라 권한 요청 중';
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          video.srcObject = stream;
          await video.play();
          status.textContent = `정상 수신: ${video.videoWidth || '?'} × ${video.videoHeight || '?'}`;
        } catch (error) {
          status.textContent = `${error.name ?? 'Error'}: ${error.message ?? String(error)}`;
          button.disabled = false;
          console.error(error);
        }
      });
    </script>
  </body>
</html>
