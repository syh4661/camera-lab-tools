name: TypeGPU depth-light demo

on:
  push:
    paths:
      - 'typegpu-depth-light-demo/**'
      - '.github/workflows/typegpu-depth-light-demo.yml'
  pull_request:
    paths:
      - 'typegpu-depth-light-demo/**'
      - '.github/workflows/typegpu-depth-light-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typegpu-depth-light-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
